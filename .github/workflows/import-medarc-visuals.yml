name: Import MedArc Visuals
on:
  push:
    branches:
      - feature/medarc-student-visuals-20261022
    paths:
      - .github/workflows/import-medarc-visuals.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Retrieve generated MedArc image assets
        env:
          BUNDLE_URL: https://at.adobe.com/AiHHVoP5kslCO2M5
          HERO_STANDING_URL: https://at.adobe.com/JajCiiKy8MZYmn6P
          HERO_DISCUSSION_URL: https://at.adobe.com/Y7gCvZIzwRvbV9br
        run: |
          python3 - <<'PY'
          import hashlib,io,os,pathlib,re,urllib.request,zipfile
          def read(url):
              req=urllib.request.Request(url,headers={"User-Agent":"MedArc-visual-asset-import/1.0"})
              with urllib.request.urlopen(req,timeout=100) as response:
                  return response.read()
          package=read(os.environ["BUNDLE_URL"])
          digest=hashlib.sha256(package).hexdigest()
          expected="32dd33450cda81cb86f2025c6a9a125fcab167e847dbe3d9a8ff047e2c2173cf"
          if digest!=expected:
              raise SystemExit("Asset bundle checksum mismatch: "+digest)
          out=pathlib.Path("public/medarc/visuals")
          out.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile(io.BytesIO(package)) as z:
              entries=[name for name in z.namelist() if re.fullmatch(r"MedArc_Visuals_20_Transparent/webp/\d\d_[a-z0-9_]+\.webp",name)]
              if len(entries)!=20:
                  raise SystemExit("Expected exactly 20 learning illustrations, got "+str(len(entries)))
              for name in entries:
                  binary=z.read(name)
                  if not binary.startswith(b"RIFF") or binary[8:12]!=b"WEBP":
                      raise SystemExit("Asset is not WebP: "+name)
                  (out/pathlib.PurePosixPath(name).name).write_bytes(binary)
          for env,name in [("HERO_STANDING_URL","hero-standing-group.png"),("HERO_DISCUSSION_URL","hero-discussion-group.png")]:
              binary=read(os.environ[env])
              if not binary.startswith(b"\x89PNG\r\n\x1a\n"):
                  raise SystemExit("Not PNG: "+name)
              pathlib.Path("public/medarc",name).write_bytes(binary)
          print("Verified checksum; prepared 20 WebP figures + 2 PNG homepage visuals")
          PY
      - name: Commit generated assets to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/medarc/
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Assets already present."
          else
            git commit -m "Add 20 transparent MedArc learning visuals and two homepage groups"
            git push
          fi
